<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 备菜提醒 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #151515; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      body { display: grid; place-items: start center; padding: 20px 0; }
      .preview { position: relative; width: 418px; height: 1240px; overflow: hidden; background: #f8faf7; box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28); }
      .preview img { display: block; width: 100%; height: 100%; user-select: none; }
      button { position: absolute; display: none; border: 0; background: transparent; cursor: pointer; padding: 0; }
      .is-ready .generate,
      .is-result .ignore,
      .is-result .open-regenerate,
      .is-ignored .open-regenerate,
      .is-regenerate .cancel-regenerate,
      .is-regenerate .confirm-regenerate { display: block; }
      .generate { left: 24px; top: 1070px; width: 370px; height: 54px; }
      .ignore { left: 24px; top: 1070px; width: 126px; height: 52px; }
      .open-regenerate { left: 160px; top: 1070px; width: 234px; height: 52px; }
      .is-ignored .open-regenerate { left: 24px; width: 370px; }
      .cancel-regenerate { left: 24px; top: 1032px; width: 126px; height: 52px; }
      .confirm-regenerate { left: 160px; top: 1032px; width: 234px; height: 52px; }
      .toast { position: absolute; left: 50%; top: 47%; z-index: 3; display: none; transform: translateX(-50%); padding: 9px 15px; border-radius: 7px; background: rgba(26, 36, 30, 0.9); color: #fff; font-size: 12px; white-space: nowrap; }
      .toast.is-visible { display: block; }
    </style>
  </head>
  <body>
    <main class="preview is-ready" id="preview">
      <img id="screen" src="./18-prep_ai-生成备菜提醒.png" alt="AI 备菜提醒页面 UI 预览" />
      <button class="generate" id="generate" aria-label="生成备菜提醒"></button>
      <button class="ignore" id="ignore" aria-label="忽略本次提醒"></button>
      <button class="open-regenerate" id="openRegenerate" aria-label="重新生成备菜提醒"></button>
      <button class="cancel-regenerate" id="cancelRegenerate" aria-label="取消重新生成"></button>
      <button class="confirm-regenerate" id="confirmRegenerate" aria-label="消耗积分重新生成"></button>
      <span class="toast" id="toast"></span>
    </main>
    <script>
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      const toast = document.getElementById("toast");
      let previousState = "result";

      const files = {
        ready: "./18-prep_ai-生成备菜提醒.png",
        result: "./18-prep_ai-备菜提醒结果.png",
        regenerate: "./18-prep_ai-重新生成确认.png",
        ignored: "./18-prep_ai-已忽略.png",
      };

      const showState = (state) => {
        if (!files[state]) state = "ready";
        if (state === "regenerate") previousState = preview.classList.contains("is-ignored") ? "ignored" : "result";
        preview.className = "preview is-" + state;
        screen.src = files[state];
      };

      const notify = (message) => {
        toast.textContent = message;
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 1300);
      };

      showState(new URLSearchParams(location.search).get("state") || "ready");
      document.getElementById("generate").addEventListener("click", () => {
        showState("result");
        notify("备菜提醒已生成");
      });
      document.getElementById("ignore").addEventListener("click", () => {
        showState("ignored");
        notify("已忽略本次提醒");
      });
      document.getElementById("openRegenerate").addEventListener("click", () => showState("regenerate"));
      document.getElementById("cancelRegenerate").addEventListener("click", () => showState(previousState));
      document.getElementById("confirmRegenerate").addEventListener("click", () => {
        showState("result");
        notify("已重新生成备菜提醒");
      });
    </script>
  </body>
</html>
