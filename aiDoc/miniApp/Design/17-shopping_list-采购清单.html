<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>采购清单 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #151515; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      body { display: grid; place-items: start center; padding: 20px 0; }
      .preview { position: relative; width: 418px; height: 1240px; overflow: hidden; background: #f8faf7; box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28); }
      .preview img { display: block; width: 100%; height: 100%; user-select: none; }
      button { position: absolute; display: none; border: 0; background: transparent; cursor: pointer; padding: 0; }
      .is-pending .pending-tab,
      .is-checked .pending-tab,
      .is-completed .pending-tab,
      .is-pending .completed-tab,
      .is-checked .completed-tab,
      .is-completed .completed-tab,
      .is-pending .copy,
      .is-checked .copy,
      .is-completed .copy,
      .is-pending .share,
      .is-checked .share,
      .is-completed .share,
      .is-pending .add,
      .is-checked .add,
      .is-completed .add { display: block; }
      .is-pending .check-first,
      .is-checked .check-first,
      .is-pending .edit-first,
      .is-checked .edit-first { display: block; }
      .is-edit .close-sheet,
      .is-add .close-sheet,
      .is-edit .cancel-sheet,
      .is-add .cancel-sheet,
      .is-edit .save-sheet,
      .is-add .save-sheet { display: block; }
      .is-edit .delete-item { display: block; }
      .pending-tab { left: 16px; top: 462px; width: 193px; height: 44px; }
      .completed-tab { left: 209px; top: 462px; width: 193px; height: 44px; }
      .copy { left: 16px; top: 362px; width: 193px; height: 50px; }
      .share { left: 209px; top: 362px; width: 193px; height: 50px; }
      .add { left: 24px; top: 1130px; width: 370px; height: 52px; }
      .check-first { left: 18px; top: 518px; width: 38px; height: 58px; }
      .edit-first { left: 56px; top: 518px; width: 344px; height: 58px; }
      .close-sheet { left: 358px; top: 694px; width: 40px; height: 40px; }
      .cancel-sheet { left: 24px; top: 1090px; width: 126px; height: 52px; }
      .save-sheet { left: 160px; top: 1090px; width: 234px; height: 52px; }
      .delete-item { left: 24px; top: 1024px; width: 370px; height: 44px; }
      .toast { position: absolute; left: 50%; top: 47%; display: none; transform: translateX(-50%); padding: 9px 15px; border-radius: 7px; background: rgba(26, 36, 30, 0.9); color: #fff; font-size: 12px; white-space: nowrap; }
      .toast.is-visible { display: block; }
    </style>
  </head>
  <body>
    <main class="preview is-pending" id="preview">
      <img id="screen" src="./17-shopping_list-采购清单.png" alt="采购清单页面 UI 预览" />
      <button class="pending-tab" id="pendingTab" aria-label="查看待购买"></button>
      <button class="completed-tab" id="completedTab" aria-label="查看已购买"></button>
      <button class="copy" id="copyList" aria-label="复制清单"></button>
      <button class="share" id="shareList" aria-label="分享清单"></button>
      <button class="add" id="openAdd" aria-label="新增采购项"></button>
      <button class="check-first" id="toggleFirst" aria-label="切换土豆购买状态"></button>
      <button class="edit-first" id="openEdit" aria-label="编辑土豆采购项"></button>
      <button class="close-sheet" id="closeSheet" aria-label="关闭"></button>
      <button class="cancel-sheet" id="cancelSheet" aria-label="取消"></button>
      <button class="save-sheet" id="saveSheet" aria-label="保存"></button>
      <button class="delete-item" id="deleteItem" aria-label="删除采购项"></button>
      <span class="toast" id="toast"></span>
    </main>
    <script>
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      const toast = document.getElementById("toast");
      let previousState = "pending";

      const files = {
        pending: "./17-shopping_list-采购清单.png",
        completed: "./17-shopping_list-已购买.png",
        checked: "./17-shopping_list-勾选已买.png",
        edit: "./17-shopping_list-编辑采购项.png",
        add: "./17-shopping_list-新增采购项.png",
      };

      const showState = (state) => {
        if (state === "edit" || state === "add") previousState = preview.className.includes("completed") ? "completed" : "pending";
        preview.className = "preview is-" + state;
        screen.src = files[state];
      };

      const notify = (message) => {
        toast.textContent = message;
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 1300);
      };

      showState(new URLSearchParams(location.search).get("state") || "pending");
      document.getElementById("pendingTab").addEventListener("click", () => showState("pending"));
      document.getElementById("completedTab").addEventListener("click", () => showState("completed"));
      document.getElementById("copyList").addEventListener("click", () => notify("采购清单已复制"));
      document.getElementById("shareList").addEventListener("click", () => notify("已调起微信分享"));
      document.getElementById("openAdd").addEventListener("click", () => showState("add"));
      document.getElementById("toggleFirst").addEventListener("click", () => {
        const checked = preview.className.includes("is-checked");
        showState(checked ? "pending" : "checked");
        notify(checked ? "已恢复为待购买" : "已标记为买好");
      });
      document.getElementById("openEdit").addEventListener("click", () => showState("edit"));
      document.getElementById("closeSheet").addEventListener("click", () => showState(previousState));
      document.getElementById("cancelSheet").addEventListener("click", () => showState(previousState));
      document.getElementById("saveSheet").addEventListener("click", () => {
        const adding = preview.className.includes("is-add");
        showState("pending");
        notify(adding ? "采购项已添加" : "采购项已更新");
      });
      document.getElementById("deleteItem").addEventListener("click", () => {
        showState("pending");
        notify("已删除土豆，可撤销");
      });
    </script>
  </body>
</html>
