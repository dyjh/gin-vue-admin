<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>饭局点餐码 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; justify-content: center; padding: 24px 0; background: #edf3ef; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .preview { position: relative; width: min(100vw, 418px); background: #fff; box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18); }
      img { display: block; width: 100%; height: auto; }
      button { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; }
      .copy { left: 34%; top: 42%; width: 32%; height: 3.2%; }
      .share { left: 8%; top: 55.8%; width: 84%; height: 4.4%; }
      .close-meal { left: 5.7%; top: 86.3%; width: 88.6%; height: 4%; }
      .cancel, .confirm { display: none; top: 87.1%; height: 4.2%; }
      .cancel { left: 5.7%; width: 41.6%; }
      .confirm { left: 52.6%; width: 41.6%; }
      .preview.is-confirming .copy, .preview.is-confirming .share, .preview.is-confirming .close-meal { display: none; }
      .preview.is-confirming .cancel, .preview.is-confirming .confirm { display: block; }
      .toast { position: absolute; left: 50%; top: 47%; display: none; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: rgba(26, 36, 30, 0.88); color: #fff; font-size: 12px; white-space: nowrap; }
      .toast.is-visible { display: block; }
    </style>
  </head>
  <body>
    <main class="preview" id="preview">
      <img id="screen" src="./14-meal_invite-饭局点餐码.png" alt="饭局点餐码页面 UI 预览" />
      <button class="copy" id="copy" aria-label="复制点餐码"></button>
      <button class="share" id="share" aria-label="分享给微信好友"></button>
      <button class="close-meal" id="closeMeal" aria-label="提前关闭点餐"></button>
      <button class="cancel" id="cancel" aria-label="继续收集"></button>
      <button class="confirm" id="confirm" aria-label="确认关闭"></button>
      <span class="toast" id="toast">点餐码已复制</span>
    </main>
    <script>
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      const toast = document.getElementById("toast");
      const showMain = () => { preview.className = "preview"; screen.src = "./14-meal_invite-饭局点餐码.png"; };
      document.getElementById("copy").addEventListener("click", () => {
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 1200);
      });
      document.getElementById("share").addEventListener("click", () => {});
      document.getElementById("closeMeal").addEventListener("click", () => {
        preview.className = "preview is-confirming";
        screen.src = "./14-meal_invite-提前关闭确认.png";
      });
      document.getElementById("cancel").addEventListener("click", showMain);
      document.getElementById("confirm").addEventListener("click", () => {});
    </script>
  </body>
</html>
