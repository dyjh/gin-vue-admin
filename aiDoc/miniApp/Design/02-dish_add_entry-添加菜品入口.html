<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>来干饭 - 添加菜品入口 UI 定稿</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        background: #edf3ef;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .preview {
        width: min(100vw, 418px);
        min-height: 100vh;
      }

      .screen {
        margin: 0 0 28px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18);
      }

      .caption {
        padding: 14px 18px;
        color: #143325;
        font-size: 15px;
        font-weight: 700;
        background: #f8fbf7;
        border-bottom: 1px solid #e1ebe4;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="preview" aria-label="添加菜品入口 UI 定稿">
      <section class="screen" aria-label="AI识别状态">
        <div class="caption">状态 1：AI识别</div>
        <img src="./02-dish_add_entry-AI识别.png" alt="添加菜品 AI 识别状态 UI 定稿" />
      </section>
      <section class="screen" aria-label="菜品录入填充后状态">
        <div class="caption">状态 2：智能填充后回到菜品录入</div>
        <img src="./02-dish_add_entry-菜品录入填充后.png" alt="添加菜品录入填充后状态 UI 定稿" />
      </section>
    </main>
  </body>
</html>
