<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>参与点菜 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #151515; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      body { display: grid; place-items: start center; padding: 20px 0; }
      .preview { position: relative; width: 418px; height: 1240px; overflow: hidden; background: #f8faf7; box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28); }
      .preview img { display: block; width: 100%; height: 100%; user-select: none; }
      button { position: absolute; display: none; border: 0; background: transparent; cursor: pointer; }
      .is-join .join { display: block; left: 34px; top: 492px; width: 350px; height: 54px; }
      .is-collecting .save { display: block; left: 226px; top: 1058px; width: 168px; height: 54px; }
      .is-closed .home { display: block; left: 226px; top: 1058px; width: 168px; height: 54px; }
      .is-cancelled .home { display: block; left: 50px; top: 674px; width: 318px; height: 50px; }
      .toast { position: absolute; left: 50%; top: 47%; display: none; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: rgba(26, 36, 30, 0.88); color: #fff; font-size: 12px; white-space: nowrap; }
      .toast.is-visible { display: block; }
    </style>
  </head>
  <body>
    <main class="preview" id="preview">
      <img id="screen" src="./15-meal_vote-参与点菜.png" alt="参与点菜页面 UI 预览" />
      <button class="join" id="join" aria-label="加入饭局"></button>
      <button class="save" id="save" aria-label="保存我的点菜"></button>
      <button class="home" id="home" aria-label="返回首页"></button>
      <span class="toast" id="toast">点菜已保存</span>
    </main>
    <script>
      const files = {
        join: "./15-meal_vote-加入饭局.png",
        collecting: "./15-meal_vote-参与点菜.png",
        closed: "./15-meal_vote-点餐已关闭.png",
        cancelled: "./15-meal_vote-饭局已取消.png",
      };
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      const toast = document.getElementById("toast");
      const showState = (state) => {
        const next = files[state] ? state : "collecting";
        preview.className = `preview is-${next}`;
        screen.src = files[next];
      };
      showState(new URLSearchParams(location.search).get("state") || "collecting");
      document.getElementById("join").addEventListener("click", () => showState("collecting"));
      document.getElementById("save").addEventListener("click", () => {
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 1200);
      });
      document.getElementById("home").addEventListener("click", () => showState("join"));
    </script>
  </body>
</html>
