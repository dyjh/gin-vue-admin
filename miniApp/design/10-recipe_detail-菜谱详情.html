<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>菜谱详情 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; justify-content: center; gap: 24px; padding: 24px 0; background: #edf3ef; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .state { width: min(100vw, 418px); }
      .label { margin: 0 0 10px; color: #315644; font-size: 14px; font-weight: 700; }
      .preview { width: min(100vw, 418px); background: #fff; box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18); }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <section class="state" aria-label="菜谱详情状态"><p class="label">菜谱详情</p><main class="preview"><img src="./10-recipe_detail-菜谱详情.png" alt="菜谱详情 UI 预览" /></main></section>
    <section class="state" aria-label="添加菜品状态"><p class="label">添加菜品</p><main class="preview"><img src="./10-recipe_detail-添加菜品.png" alt="添加菜品 UI 预览" /></main></section>
    <section class="state" aria-label="左滑移除菜品状态"><p class="label">左滑移除菜品</p><main class="preview"><img src="./10-recipe_detail-左滑移除.png" alt="左滑移除菜品 UI 预览" /></main></section>
    <section class="state" aria-label="删除菜谱确认状态"><p class="label">删除确认</p><main class="preview"><img src="./10-recipe_detail-删除确认.png" alt="删除菜谱确认 UI 预览" /></main></section>
  </body>
</html>
