<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; justify-content: center; padding: 24px 0; background: #edf3ef; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .preview { position: relative; width: min(100vw, 418px); background: #fff; box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18); }
      img { display: block; width: 100%; height: auto; }
      button { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; }
      .profile-trigger { left: 5%; top: 5.6%; width: 47%; height: 6.2%; }
      .shopping-trigger { left: 0; top: 56.6%; width: 100%; height: 4.6%; }
      .editor-dismiss { display: none; inset: 0; }
      .preview.is-editing .profile-trigger,
      .preview.is-editing .shopping-trigger { display: none; }
      .preview.is-editing .editor-dismiss { display: block; }
    </style>
  </head>
  <body>
    <main class="preview" id="preview">
      <img id="screen" src="./11-profile-我的.png" alt="我的页面 UI 预览" />
      <button class="profile-trigger" id="profileTrigger" aria-label="编辑头像和昵称" title="编辑头像和昵称"></button>
      <button class="shopping-trigger" id="shoppingTrigger" aria-label="进入采购清单" title="进入采购清单"></button>
      <button class="editor-dismiss" id="editorDismiss" aria-label="关闭资料编辑面板" title="关闭资料编辑面板"></button>
    </main>
    <script>
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      document.getElementById("shoppingTrigger").addEventListener("click", () => {
        location.href = "./17-shopping_list-采购清单.html";
      });
      document.getElementById("profileTrigger").addEventListener("click", () => {
        screen.src = "./11-profile-编辑头像昵称.png";
        preview.classList.add("is-editing");
      });
      document.getElementById("editorDismiss").addEventListener("click", () => {
        screen.src = "./11-profile-我的.png";
        preview.classList.remove("is-editing");
      });
    </script>
  </body>
</html>
