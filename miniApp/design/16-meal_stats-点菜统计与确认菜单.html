<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>点菜统计与确认菜单 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #151515; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      body { display: grid; place-items: start center; padding: 20px 0; }
      .preview { position: relative; width: 418px; height: 1240px; overflow: hidden; background: #f8faf7; box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28); }
      .preview img { display: block; width: 100%; height: 100%; user-select: none; }
      button { position: absolute; display: none; border: 0; background: transparent; cursor: pointer; }
      .is-main .open-confirm { display: block; left: 24px; top: 1050px; width: 370px; height: 54px; }
      .is-confirm .cancel { display: block; left: 24px; top: 1034px; width: 136px; height: 52px; }
      .is-confirm .generate { display: block; left: 170px; top: 1034px; width: 224px; height: 52px; }
      .toast { position: absolute; left: 50%; top: 47%; display: none; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: rgba(26, 36, 30, 0.88); color: #fff; font-size: 12px; white-space: nowrap; }
      .toast.is-visible { display: block; }
    </style>
  </head>
  <body>
    <main class="preview is-main" id="preview">
      <img id="screen" src="./16-meal_stats-点菜统计与确认菜单.png" alt="点菜统计与确认菜单页面 UI 预览" />
      <button class="open-confirm" id="openConfirm" aria-label="确认菜单并生成采购清单"></button>
      <button class="cancel" id="cancel" aria-label="再检查一下"></button>
      <button class="generate" id="generate" aria-label="确认并生成"></button>
      <span class="toast" id="toast">采购清单已生成</span>
    </main>
    <script>
      const preview = document.getElementById("preview");
      const screen = document.getElementById("screen");
      const toast = document.getElementById("toast");
      const showState = (state) => {
        const confirm = state === "confirm";
        preview.className = "preview " + (confirm ? "is-confirm" : "is-main");
        screen.src = confirm ? "./16-meal_stats-确认生成采购清单.png" : "./16-meal_stats-点菜统计与确认菜单.png";
      };
      showState(new URLSearchParams(location.search).get("state") || "main");
      document.getElementById("openConfirm").addEventListener("click", () => showState("confirm"));
      document.getElementById("cancel").addEventListener("click", () => showState("main"));
      document.getElementById("generate").addEventListener("click", () => {
        showState("main");
        toast.classList.add("is-visible");
        setTimeout(() => {
          location.href = "./17-shopping_list-采购清单.html";
        }, 450);
      });
    </script>
  </body>
</html>
