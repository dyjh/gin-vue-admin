<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>菜品详情 UI 预览</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        background: #edf3ef;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .preview {
        width: min(100vw, 418px);
        min-height: 100vh;
        background: #fff;
        box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="preview" aria-label="菜品详情 UI 预览">
      <img src="./04-dish_detail-preview.png" alt="菜品详情 UI 预览" />
    </main>
  </body>
</html>
