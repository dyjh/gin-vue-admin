<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>菜谱 UI 预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        justify-content: center;
        gap: 24px;
        padding: 24px 0;
        background: #edf3ef;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .state { width: min(100vw, 418px); }
      .label { margin: 0 0 10px; color: #315644; font-size: 14px; font-weight: 700; }
      .preview { width: min(100vw, 418px); background: #fff; box-shadow: 0 24px 80px rgba(18, 42, 29, 0.18); }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <section class="state" aria-label="菜谱列表状态">
      <p class="label">有菜谱</p>
      <main class="preview"><img src="./09-recipes-preview.png" alt="菜谱列表 UI 预览" /></main>
    </section>
    <section class="state" aria-label="菜谱空状态">
      <p class="label">空状态</p>
      <main class="preview"><img src="./09-recipes-empty-preview.png" alt="菜谱空状态 UI 预览" /></main>
    </section>
  </body>
</html>
